<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>영상 컨트롤타워</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c1e21;--mut:#6b7280;--bd:#e5e7eb;--ok:#16a34a;--wait:#d97706;--bad:#dc2626;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e26;--fg:#e8eaed;--mut:#9aa0ab;--bd:#2c313c}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
h1{font-size:20px}h2{font-size:16px;margin:24px 0 8px}h3{font-size:13px;color:var(--mut);margin:12px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;overflow-x:auto}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.t{white-space:normal;min-width:180px}.s{font-weight:600}.uploaded{color:var(--ok)}.scheduled,.ready{color:var(--wait)}.failed{color:var(--bad)}
button{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:6px;padding:4px 8px;cursor:pointer;margin-right:4px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
</style></head><body>
<h1>영상 컨트롤타워</h1><div id="sum" style="color:var(--mut)"></div><div id="root"></div>
<script>
const L={ready:"대기",scheduled:"예약",uploaded:"완료",failed:"실패"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){
  const v=await (await fetch("/api/videos")).json(), g={};
  v.forEach(x=>{((g[x.channel_name+" ("+x.google_account+")"]??={})[x.source+" · "+x.slot_time]??=[]).push(x)});
  const n=k=>v.filter(x=>x.status==k).length;
  sum.textContent=`전체 ${v.length} · 업로드 완료 ${n("uploaded")} · 예약 ${n("scheduled")} · 대기 ${n("ready")}`;
  root.innerHTML=Object.entries(g).map(([ch,ss])=>`<h2>${esc(ch)}</h2>`+Object.entries(ss).map(([s,vs])=>
   `<h3>${esc(s)}</h3><div class="card"><table><tr><th>상태</th><th>예정/완료</th><th>제목</th><th>썸네일</th><th></th></tr>`+vs.map(x=>
   `<tr><td class="s ${x.status}">${L[x.status]}</td><td>${(x.uploaded_at||x.scheduled_at||"-").replace("T"," ")}</td>
    <td class="t">${esc(x.title)}</td><td>${esc(x.thumbnail_path)||"-"}</td><td>`+
    (x.status=="uploaded"?(x.youtube_url?`<a href="${esc(x.youtube_url)}" target="_blank">링크</a>`:""):
     `<button onclick='cp(${JSON.stringify(x.title)})'>제목 복사</button>
      <button class="p" onclick="up(${x.id})">업로드 페이지 열기</button><button onclick="done(${x.id})">완료 처리</button>`)+
   `</td></tr>`).join("")+`</table></div>`).join("")).join("");
}
const cp=t=>navigator.clipboard.writeText(t);
function up(id){window.open("https://studio.youtube.com","_blank")}
async function done(id){const url=prompt("업로드된 영상 URL (선택)")??"";
  await fetch("/api/mark",{method:"POST",body:JSON.stringify({id,status:"uploaded",url})});load()}
load();
</script></body></html>
